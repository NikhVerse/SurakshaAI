services:
  # ==========================================
  # 1. Frontend Web Service (Next.js 16)
  # ==========================================
  - type: web
    name: suraksha-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: suraksha-api
          property: host

  # ==========================================
  # 2. Backend Web Service (FastAPI)
  # ==========================================
  - type: web
    name: suraksha-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r apps/api/requirements.txt && python scripts/seed_data.py
    startCommand: uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./surakshaai.db
      - key: JWT_SECRET
        value: surakshaai_production_jwt_secret_render_deployment_938472918237
